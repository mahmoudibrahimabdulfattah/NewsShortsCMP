<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Shorts</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #0D1B2A;
    --bg-2: #1B263B;
    --card: #16213E1a;
    --text: #F0F4F8;
    --text-dim: #F0F4F8b3;
    --border: #FFFFFF1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, var(--bg), var(--bg-2));
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  main {
    max-width: 420px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
  }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  p { color: var(--text-dim); line-height: 1.6; margin: 0 0 12px; }
  .ar { direction: rtl; border-top: 1px solid var(--border); margin-top: 20px; padding-top: 20px; }
</style>
</head>
<body>
<main>
  <h1>News Shorts</h1>
  <p>Open the News Shorts app on this device to continue signing in. If the app
  is installed, tapping the link in your email again should open it directly.</p>
  <div class="ar">
    <p>افتح تطبيق News Shorts على هذا الجهاز لإتمام تسجيل الدخول. إذا كان
    التطبيق مثبّتاً، فالضغط على الرابط في بريدك مرة أخرى سيفتحه مباشرة.</p>
  </div>
</main>
</body>
</html>
