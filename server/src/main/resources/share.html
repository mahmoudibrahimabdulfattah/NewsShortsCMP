<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Shorts</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 20px 40px;
    background: #0F1B2A; color: #F2F5F8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6; display: flex; justify-content: center;
  }
  .card { width: 100%; max-width: 560px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 24px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #4ECDC4; }
  .badge {
    display: inline-block; background: #4ECDC4; color: #06222B;
    font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 999px;
  }
  h1 { font-size: 26px; line-height: 1.35; margin: 16px 0 12px; }
  .meta { font-size: 14px; opacity: .7; margin-bottom: 18px; }
  p.summary { font-size: 17px; opacity: .9; }
  .note { font-size: 13px; opacity: .5; margin: 18px 0 28px; }
  a.button {
    display: block; text-align: center; text-decoration: none;
    padding: 15px 20px; border-radius: 14px; font-weight: 700; margin-bottom: 12px;
  }
  a.primary { background: #4ECDC4; color: #06222B; }
  a.secondary { background: rgba(255,255,255,.08); color: #F2F5F8; }
  /* The button rules set an explicit display, which would otherwise beat the
     hidden attribute's UA style and show buttons that have no destination. */
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="dot"></span><span>News Shorts</span></div>
  <span class="badge" id="category" hidden></span>
  <h1 id="title">…</h1>
  <div class="meta" id="meta"></div>
  <p class="summary" id="summary"></p>
  <p class="note" id="note"></p>

  <div id="actions">
    <a class="button primary" id="open" href="#" hidden></a>
    <a class="button secondary" id="store" href="#" hidden></a>
    <a class="button secondary" id="source" href="#" rel="noopener noreferrer"></a>
  </div>
</div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var get = function (key) { return (params.get(key) || "").trim(); };

  // Same allowlist the app applies. This page can be handed any query string,
  // and it must never turn one into a javascript: or data: navigation.
  var webUrl = function (value) { return /^https?:\/\//i.test(value) ? value : ""; };

  var articleUrl = webUrl(get("url"));
  var title = get("title");
  var summary = get("summary");
  var source = get("source");
  var category = get("category");
  var published = parseInt(get("published"), 10);

  // The shared article's language, not the reader's: a story shared from the
  // English feed should not land on a right-to-left Arabic page.
  var isArabic = get("lang").toLowerCase() !== "en";
  var copy = isArabic
    ? { open: "فتح في التطبيق", store: "تحميل التطبيق", source: "اقرأ من المصدر",
        fallbackTitle: "خبر من News Shorts",
        note: "ملخص مُولَّد بالذكاء الاصطناعي. افتح المصدر لقراءة الخبر كاملاً." }
    : { open: "Open in the app", store: "Get the app", source: "Read at source",
        fallbackTitle: "A story from News Shorts",
        note: "AI-generated summary. Open the source for the full story." };

  document.documentElement.lang = isArabic ? "ar" : "en";
  document.documentElement.dir = isArabic ? "rtl" : "ltr";

  var text = function (id, value) {
    var el = document.getElementById(id);
    if (value) { el.textContent = value; } else { el.hidden = true; }
  };

  document.title = title || "News Shorts";
  text("title", title || copy.fallbackTitle);
  text("summary", summary);
  if (category) { var c = document.getElementById("category"); c.textContent = category; c.hidden = false; }
  var meta = [];
  if (source) meta.push(source);
  if (published > 0) {
    meta.push(new Date(published).toLocaleDateString(isArabic ? "ar" : "en", {
      day: "numeric", month: "long", year: "numeric"
    }));
  }
  text("meta", meta.join(" • "));
  text("note", summary ? copy.note : "");

  var sourceLink = document.getElementById("source");
  if (articleUrl) {
    sourceLink.textContent = copy.source;
    sourceLink.href = articleUrl;
  } else {
    sourceLink.hidden = true;
  }

  var storeUrl = "__PLAY_STORE_URL__";
  if (storeUrl && storeUrl.indexOf("__") !== 0) {
    var store = document.getElementById("store");
    store.textContent = copy.store;
    store.href = storeUrl;
    store.hidden = false;
  }

  // Offered only on Android, and only as a link the reader taps.
  //
  // The scheme is registered on Android alone, so showing this button elsewhere
  // would produce a browser error dialog. And Chrome blocks a scheme navigation
  // that no user gesture asked for, so an automatic redirect on load silently
  // does nothing while making everyone else wait — the tap is both the reliable
  // trigger and the honest one. `src=share` lets the app report a share-driven
  // open separately from a notification.
  if (articleUrl && /Android/i.test(navigator.userAgent)) {
    var open = document.getElementById("open");
    open.textContent = copy.open;
    open.href = "newsshorts://article" + location.search +
      (location.search ? "&" : "?") + "src=share";
    open.hidden = false;
  }
})();
</script>
</body>
</html>
