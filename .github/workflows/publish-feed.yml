name: Publish news feed

# Fetches RSS sources, summarizes new articles with Gemini, and publishes the
# result as static JSON to GitHub Pages. The feed is read-only and refreshed on
# a schedule, so a CDN serves it better than a long-running server — and it
# costs nothing on a public repository.
on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:
    inputs:
      disable_health_guards:
        description: Publish this manual run even when feed health checks fail
        required: false
        default: false
        type: boolean
  push:
    branches: [master]
    paths:
      - "server/**"
      - ".github/workflows/publish-feed.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running publish finish rather than cancelling it — a half-written feed
# is worse than a slightly stale one.
concurrency:
  group: publish-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      health_summary: ${{ steps.health_diagnostic.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Carries summaries between runs so already-summarized articles don't
      # spend Gemini quota again.
      - name: Restore article database
        uses: actions/cache/restore@v4
        with:
          path: news.db
          key: news-db-${{ github.run_id }}
          restore-keys: news-db-

      - name: Generate feed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: without it the run publishes the feed but sends no push.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DB_PATH: news.db
          # A manual bypass applies only to the run that requested it, so an
          # incident override cannot silently weaken later scheduled publishes.
          DISABLE_PUBLISH_HEALTH_GUARDS: ${{ github.event_name == 'workflow_dispatch' && inputs.disable_health_guards }}
          STALE_HOURS: ${{ vars.STALE_HOURS }}
          # A specialised feed must hold at least one complete page. Unset uses
          # the backend default of 40.
          MIN_CATEGORY_ARTICLES: ${{ vars.MIN_CATEGORY_ARTICLES }}
          # The whole Gemini budget for a run, and the arithmetic behind it.
          # The free tier caps requests per day, not tokens, so the two numbers
          # below are request counts in disguise: 400 renders is 20 requests at
          # the summarizer's batch of 20, and 600 classifications is 6 more at
          # the classifier's batch of 100. Twenty-six requests, 48 runs a day,
          # is about 1,250 against a cap near 1,500 — with room for the retries
          # a bad afternoon adds.
          MAX_SUMMARIES_PER_CYCLE: "400"
          # Only articles already summarized reach this queue: a new article is
          # classified inside the request that writes its summary, for free.
          # This is what drains the backlog left by every article stored before
          # classification existed, and 600 a run clears a week of them in a day.
          MAX_CLASSIFICATIONS_PER_CYCLE: "600"
          # A week of history gives the thinner categories enough depth to
          # scroll through; older articles are pruned before rendering so the
          # budget never goes to stale news.
          RETENTION_DAYS: "7"
          # Empty until the app is published; the share page then hides its
          # store button rather than linking somewhere that 404s.
          PLAY_STORE_URL: ${{ vars.PLAY_STORE_URL }}
          # A shared article's landing page needs absolute URLs — the crawler
          # that draws the preview card has no page to resolve a relative one
          # against. Unset falls back to this same address.
          SITE_BASE_URL: https://mahmoudibrahimabdulfattah.github.io/NewsShortsCMP
          # How long a shared link keeps opening its story, and how many pages
          # that is allowed to cost. The page count is the one that binds: every
          # archived article is a file in the artifact uploaded below, on every
          # run. Unset means 90 days and 40,000 pages, about 155 MB.
          SHARE_PAGE_RETENTION_DAYS: ${{ vars.SHARE_PAGE_RETENTION_DAYS }}
          MAX_SHARE_PAGES: ${{ vars.MAX_SHARE_PAGES }}
          # The kill switch for released builds. Raising this in repository
          # variables blocks every build below it on the next publish — no app
          # release needed, which is the whole point. Unset means "support all".
          MIN_SUPPORTED_VERSION_CODE: ${{ vars.MIN_SUPPORTED_VERSION_CODE }}
          LATEST_VERSION_CODE: ${{ vars.LATEST_VERSION_CODE }}
          # allow | warn | block — what a rooted or repackaged install does.
          # Unset means warn.
          ROOT_POLICY: ${{ vars.ROOT_POLICY }}
          # Same values for emulators and developer-mode devices. Unset means
          # block, which only ever applies to release builds.
          EMULATOR_POLICY: ${{ vars.EMULATOR_POLICY }}
        run: ./gradlew :server:generateStaticFeed -PoutputDir=build/site --no-daemon

      - name: Read health diagnostic
        id: health_diagnostic
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f build/site/v1/health.json ]]; then
            summary="$(jq -c '{generatedAt, guardsDisabled, warningChecks, failedChecks, sourcesTotal, sourcesEmpty, sourcesRejected, articlesInserted, textsRendered, textsFailed, articlesClassified, articlesPendingClassification, feedArticles, newestArticleAt, categoryFeedArticles, newestCategoryArticleAt, categoryGuardsReady}' build/site/v1/health.json)"
            echo "summary=$summary" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "summary=" >> "$GITHUB_OUTPUT"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # A failed generator never reaches the Pages artifact step, so its health
      # file needs a separate path off the runner for diagnosis.
      - name: Upload health diagnostic
        if: ${{ always() && steps.health_diagnostic.outputs.exists == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: publish-health-${{ github.run_id }}
          path: build/site/v1/health.json
          retention-days: 7

      # A health rejection still completed useful classification and
      # translation work. Persist it so the next run advances instead of
      # retrying the same first batch while Pages keeps the last good feed.
      - name: Save article database
        if: ${{ always() && steps.health_diagnostic.outputs.exists == 'true' && hashFiles('news.db') != '' }}
        uses: actions/cache/save@v4
        with:
          path: news.db
          key: news-db-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

      - id: deployment
        uses: actions/deploy-pages@v4

  alert:
    needs: publish
    if: ${{ always() && (needs.publish.result == 'failure' || needs.publish.result == 'cancelled') }}
    runs-on: ubuntu-latest
    permissions: { issues: write }
    env:
      GH_TOKEN: ${{ github.token }}
      HEALTH_SUMMARY: ${{ needs.publish.outputs.health_summary }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update publish failure
        shell: bash
        run: |
          gh label create publish-failure \
            --repo "$GITHUB_REPOSITORY" \
            --color D73A4A \
            --description "The scheduled news feed publish needs attention" \
            --force

          body_file="$RUNNER_TEMP/publish-failure.md"
          {
            printf 'The news feed publish concluded **%s**.\n\n' "$PUBLISH_RESULT"
            printf '[Open the workflow run](%s) for logs and artifacts.\n\n' "$RUN_URL"
            if [[ -n "$HEALTH_SUMMARY" ]]; then
              printf 'Health summary:\n\n```json\n%s\n```\n' "$HEALTH_SUMMARY"
            else
              printf 'No health report was produced. The run failed before health evaluation, during infrastructure setup, or after generation.\n'
            fi
          } > "$body_file"

          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label publish-failure \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "News feed publish is failing" \
              --label publish-failure \
              --body-file "$body_file"
          fi

  recover:
    needs: publish
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { issues: write }
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Close a recovered publish failure
        shell: bash
        run: |
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label publish-failure \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "$issue_number" ]]; then
            exit 0
          fi

          body_file="$RUNNER_TEMP/publish-recovery.md"
          printf 'The feed published successfully again: [open the recovery run](%s).\n' "$RUN_URL" > "$body_file"
          gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY"
