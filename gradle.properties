#Kotlin
kotlin.code.style=official
# Memory here is a budget, not a wish: this is a 16 GB machine that also runs
# Android Studio and an emulator while the build is going. Raising a daemon's
# heap past what is actually free does not make it fit — it makes the machine
# swap, and a link task that would have failed in ten minutes grinds for an
# hour instead.
#
# JS and Wasm IR link tasks are the hungry ones, and the ceiling scales with the
# number of modules rather than the amount of code: each links a whole bundle,
# and several can run at once. The fix for thirteen modules is fewer of them at
# a time (org.gradle.workers.max below), not a bigger heap.
kotlin.daemon.jvmargs=-Xmx4096M

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
# Parallel, but capped. Uncapped, Gradle sizes the pool from the CPU count and
# starts more concurrent Kotlin link tasks than the heap above can hold.
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.configuration-cache=true
org.gradle.caching=true
newsshorts.versionCode=1
newsshorts.versionName=1.0.0

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
