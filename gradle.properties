#Kotlin
kotlin.code.style=official
# JS and Wasm IR link tasks are memory-hungry; 3 GB stopped being enough once
# the Compose UI became its own module.
kotlin.daemon.jvmargs=-Xmx5120M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
newsshorts.versionCode=1
newsshorts.versionName=1.0.0

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
